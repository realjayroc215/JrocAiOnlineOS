// ============================================================
// DATA: All navigation structure & section content
// ============================================================
const NAV_STRUCTURE = [
  { group: 'Overview', items: [
    { id:'introduction', label:'Introduction' },

    { id:'base-urls', label:'Base URLs' },
    { id:'rate-limits', label:'Rate Limits' },

    { id:'sdks', label:'SDKs' },
  ]},
  { group: 'Control Plane', items: [
    { id:'cp-overview', label:'Overview' },
    { id:'cp-clusters', label:'Cluster Management' },
    { id:'cp-nodes', label:'Node Registry' },
    { id:'cp-health', label:'Health & Status' },
  ]},
  { group: 'Compute', items: [
    { id:'deploy', label:'Deploy' },
    { id:'jobs', label:'Jobs' },
    { id:'loadbalancer', label:'Load Balancer' },
  ]},
  { group: 'Networking', items: [
    { id:'servicemesh', label:'Service Mesh' },
    { id:'apigateway', label:'API Gateway' },
    { id:'cdn', label:'CDN' },
    { id:'federation', label:'Federation' },
  ]},
  { group: 'Data', items: [
    { id:'dblayer', label:'DB Layer' },
    { id:'objectstore', label:'Object Store' },
    { id:'cache', label:'Cache' },
  ]},
  { group: 'Observability', items: [
    { id:'metrics', label:'Metrics' },
    { id:'logs', label:'Logs' },
    { id:'tracing', label:'Tracing' },
    { id:'events', label:'Events' },
  ]},
  { group: 'Platform', items: [
    { id:'secrets', label:'Secrets' },
    { id:'registry', label:'Registry' },
    { id:'config', label:'Config' },
    { id:'backup', label:'Backup' },
    { id:'billing', label:'Billing' },
  ]},
];

// Helper to generate syntax-highlighted JSON
function jsonHL(obj, indent) {
  indent = indent || 2;
  const raw = JSON.stringify(obj, null, indent);
  return raw
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"([^"]+)":/g, '<span class="json-key">"$1"</span>:')
    .replace(/: "((?:[^"\\]|\\.)*)"/g, ': <span class="json-string">"$1"</span>')
    .replace(/: (\d+\.?\d*)/g, ': <span class="json-number">$1</span>')
    .replace(/: (true|false)/g, ': <span class="json-bool">$1</span>')
    .replace(/: (null)/g, ': <span class="json-null">null</span>');
}

function curlHL(text) {
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/^(curl)/gm, '<span class="curl-cmd">curl</span>')
    .replace(/(--[a-z-]+|-[A-Za-z])\b/g, '<span class="curl-flag">$1</span>')
    .replace(/(https?:\/\/[^\s"\\]+)/g, '<span class="curl-url">$1</span>')
    .replace(/"(Bearer [^"]+)"/g, '"<span class="json-string">$1</span>"');
}

function codeBlock(content, lang) {
  const id = 'cb-' + Math.random().toString(36).substr(2, 6);
  return `<div class="code-block"><button class="copy-btn" data-copy-id="${id}"><i data-lucide="copy" class="w-3 h-3"></i> Copy</button><pre id="${id}">${content}</pre></div>`;
}

function methodBadge(method) {
  return `<span class="method-badge method-${method.toLowerCase()}">${method}</span>`;
}

function endpointCard(ep) {
  const tid = 'try-' + Math.random().toString(36).substr(2, 6);
  let html = `<div class="endpoint-card">
    <div class="endpoint-header">
      ${methodBadge(ep.method)}
      <span class="endpoint-path">${ep.path}</span>
      <span class="endpoint-desc hidden sm:inline">${ep.desc}</span>
    </div>
    <div class="px-5 pb-4">
      <p class="text-sm mb-3 sm:hidden" style="color:var(--text-muted);">${ep.desc}</p>`;
  if (ep.params && ep.params.length) {
    html += `<div class="overflow-x-auto mb-3"><table class="param-table"><thead><tr><th>Name</th><th>In</th><th>Type</th><th>Req</th><th>Description</th></tr></thead><tbody>`;
    ep.params.forEach(p => {
      html += `<tr><td><span class="param-name">${p.name}</span></td><td class="text-xs" style="color:var(--text-muted);">${p.loc}</td><td><span class="param-type">${p.type}</span></td><td><span class="param-required ${p.req?'required-yes':'required-no'}">${p.req?'Yes':'No'}</span></td><td class="text-xs" style="color:var(--text-muted);">${p.desc}</td></tr>`;
    });
    html += `</tbody></table></div>`;
  }
  if (ep.reqBody) {
    html += `<div class="text-xs font-semibold uppercase tracking-wider mb-1" style="color:var(--text-muted);">Request Body</div>`;
    html += codeBlock(jsonHL(ep.reqBody), 'json');
  }
  if (ep.resBody) {
    html += `<div class="text-xs font-semibold uppercase tracking-wider mb-1 mt-3" style="color:var(--text-muted);">Response <span class="ml-1 px-1.5 py-0.5 rounded text-xs" style="background:rgba(63,185,80,0.15);color:#3fb950;">${ep.resStatus||200}</span></div>`;
    html += codeBlock(jsonHL(ep.resBody), 'json');
  }
  if (ep.errors && ep.errors.length) {
    html += `<div class="text-xs font-semibold uppercase tracking-wider mb-1 mt-3" style="color:var(--text-muted);">Possible Errors</div>`;
    html += `<div class="overflow-x-auto"><table class="error-table"><thead><tr><th>Status</th><th>Code</th><th>Description</th></tr></thead><tbody>`;
    ep.errors.forEach(e => {
      html += `<tr><td>${e.status}</td><td style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-muted);">${e.code}</td><td class="text-xs" style="color:var(--text-muted);">${e.desc}</td></tr>`;
    });
    html += `</tbody></table></div>`;
  }
  html += `</div>`;
  // Try it section
  const curlCmd = `curl ${ep.method === 'GET' ? '' : `-X ${ep.method} \\\n  `}https://api.jrocos.io${ep.path.replace(/\{[^}]+\}/g, (m) => m.replace(/[{}]/g,''))} \\\n  -H "Authorization: Bearer jroc_sk_live_xxxxxxxxxxxxxxxxxxxx" \\\n  -H "Content-Type: application/json"`;
  html += `<div class="try-it-toggle" data-try-id="${tid}"><i data-lucide="terminal" class="w-3.5 h-3.5"></i> Try it</div>`;
  html += `<div class="try-it-content" id="${tid}">${codeBlock(curlHL(curlCmd), 'bash')}</div>`;
  html += `</div>`;
  return html;
}

      <div class="nav-group-items" style="max-height:${group.items.length * 40}px;">`;
    group.items.forEach(item => {
      html += `<div class="nav-item" data-section="${item.id}">${item.label}</div>`;
    });
    html += `</div></div>`;
  });
  nav.innerHTML = html;
}
renderNav();

// ============================================================
// UTILITY: Toast notification
// ============================================================
let toastTimer = null;
function showToast(message) {
  const toast = document.getElementById('toast-notification');
  toast.textContent = message;
  toast.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove('show');
  }, 2000);
}

// ============================================================
// UTILITY: Re-init Lucide icons safely
// ============================================================
function refreshIcons() {
  if (typeof lucide !== "undefined" && typeof lucide.createIcons === "function") {
    lucide.createIcons();
  }
}

// ============================================================
// SECTION SWITCHING
// ============================================================
let currentSection = 'introduction';

function navigateTo(sectionId) {
  if (!SECTIONS[sectionId]) return;
  currentSection = sectionId;
  const main = document.getElementById('main-content-q6r1');
  main.innerHTML = SECTIONS[sectionId]();
  // Re-init lucide icons
  refreshIcons();
  // Update active nav
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.section === sectionId);
  });
  // Ensure nav group containing active item is expanded
  document.querySelectorAll('.nav-group').forEach(group => {
    const activeChild = group.querySelector('.nav-item.active');
    if (activeChild) {
      group.classList.remove('collapsed');
    }
  });
  // Update breadcrumb
  let groupName = '';
  let itemName = '';
  NAV_STRUCTURE.forEach(g => {
    g.items.forEach(i => {
      if (i.id === sectionId) { groupName = g.group; itemName = i.label; }
    });
  });
  document.getElementById('breadcrumb-section-i3k7').textContent = (groupName ? groupName + ' / ' : '') + itemName;
  // Update URL hash
  history.pushState({ section: sectionId }, '', '#' + sectionId);
  // Build TOC
  buildTOC();
  // Bind copy buttons and try-it toggles
  bindInteractions();
  // Scroll window to top (FIX: was incorrectly scrolling main element)
  window.scrollTo({top: 0, behavior: 'smooth'});
  // Close mobile menu
  closeMobileMenu();
}

function buildTOC() {
  const tocContainer = document.getElementById('toc-links-u8v4');
  const headings = document.querySelectorAll('#main-content-q6r1 h2[id]');
  let html = '';
  headings.forEach(h => {
    html += `<a class="toc-link" data-toc-target="${h.id}">${h.textContent}</a>`;
  });
  tocContainer.innerHTML = html;
  tocContainer.querySelectorAll('.toc-link').forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      const target = document.getElementById(link.dataset.tocTarget);
      if (target) target.scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
}

// ============================================================
// TOC Scroll Spy (FIX: was completely missing)
// ============================================================
function updateTocActiveState() {
  const headings = document.querySelectorAll('#main-content-q6r1 h2[id]');
  const tocLinks = document.querySelectorAll('#toc-links-u8v4 .toc-link');
  if (headings.length === 0 || tocLinks.length === 0) return;

  let activeId = null;
  const scrollTop = window.scrollY;
  const offset = 100;

  headings.forEach(h => {
    if (h.getBoundingClientRect().top + window.scrollY - offset <= scrollTop) {
      activeId = h.id;
    }
  });

  // If we haven't scrolled past any heading, activate the first one
  if (!activeId && headings.length > 0) {
    activeId = headings[0].id;
  }

  tocLinks.forEach(link => {
    link.classList.toggle('active', link.dataset.tocTarget === activeId);
  });
}

function bindInteractions() {
  // Copy buttons
  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const pre = document.getElementById(btn.dataset.copyId);
      if (pre) {
        const text = pre.textContent;
        navigator.clipboard.writeText(text).then(() => {
          btn.innerHTML = '<i data-lucide="check" class="w-3 h-3"></i> Copied!';
          refreshIcons();
          setTimeout(() => {
            btn.innerHTML = '<i data-lucide="copy" class="w-3 h-3"></i> Copy';
            refreshIcons();
          }, 2000);
        }).catch(() => {
          // Fallback for clipboard API failures
          showToast('Failed to copy');
        });
      }
    });
  });
  // Try-it toggles
  document.querySelectorAll('.try-it-toggle').forEach(toggle => {
    toggle.addEventListener('click', () => {
      const content = document.getElementById(toggle.dataset.tryId);
      if (content) {
        content.classList.toggle('open');
        refreshIcons();
      }
    });
  });
}

// ============================================================
// EVENT LISTENERS
// ============================================================

// Nav item clicks
document.getElementById('sidebar-links-e1g5').addEventListener('click', (e) => {
  const navItem = e.target.closest('.nav-item');
  if (navItem) {
    navigateTo(navItem.dataset.section);
    return;
  }
  const groupToggle = e.target.closest('.nav-group-title');
  if (groupToggle) {
    const group = groupToggle.closest('.nav-group');
    group.classList.toggle('collapsed');
  }
});

// Search - FIX: use mousedown instead of click to beat blur race condition
const searchInput = document.getElementById('search-input-m2n8');
const searchResults = document.getElementById('search-results-r5t2');
let searchBlurEnabled = true;

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if (q.length < 2) { searchResults.classList.remove('visible'); searchResults.innerHTML = ''; return; }
  const matches = SEARCH_INDEX.filter(ep => {
    return ep.path.toLowerCase().includes(q) || ep.desc.toLowerCase().includes(q) || ep.group.toLowerCase().includes(q);
  }).slice(0, 12);
  if (matches.length === 0) {
    searchResults.innerHTML = '<div class="p-4 text-xs text-center" style="color:var(--text-muted);">No results found</div>';
    searchResults.classList.add('visible');
    return;
  }
  let html = '';
  matches.forEach(m => {
    if (m.isNavItem) {
      html += `<div class="search-result-item" data-search-section="${m.section}">
        <span class="text-xs font-medium px-2 py-0.5 rounded" style="background:var(--accent-dim);color:var(--accent);">${m.group}</span>
        <span class="text-sm">${m.desc}</span>
      </div>`;
    } else {
      html += `<div class="search-result-item" data-search-section="${m.section}">
        ${methodBadge(m.method)}
        <span class="font-mono text-xs flex-1" style="color:var(--text-primary);">${m.path}</span>
        <span class="text-xs hidden sm:inline" style="color:var(--text-muted);">${m.group}</span>
      </div>`;
    }
  });
  searchResults.innerHTML = html;
  searchResults.classList.add('visible');
  // FIX: Use mousedown to fire before blur
  searchResults.querySelectorAll('.search-result-item').forEach(item => {
    item.addEventListener('mousedown', (e) => {
      e.preventDefault(); // Prevent blur from firing
      navigateTo(item.dataset.searchSection);
      searchInput.value = '';
      searchResults.classList.remove('visible');
    });
  });
});

searchInput.addEventListener('blur', () => {
  setTimeout(() => searchResults.classList.remove('visible'), 250);
});

// FIX: Also handle Enter key in search to navigate to first result
searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const firstResult = searchResults.querySelector('.search-result-item');
    if (firstResult) {
      navigateTo(firstResult.dataset.searchSection);
      searchInput.value = '';
      searchResults.classList.remove('visible');
      searchInput.blur();
    }
  }
  if (e.key === 'Escape') {
    searchResults.classList.remove('visible');
    searchInput.blur();
  }
});

// Keyboard shortcut ⌘K
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    searchInput.focus();
  }
});

// Theme toggle - FIX: update icon when toggling
const themeBtn = document.getElementById('theme-toggle-n5p9');
let isDark = localStorage.getItem('jroc-theme') !== 'light';
function applyTheme() {
  if (isDark) {
    document.body.classList.remove('light-mode');
  } else {
    document.body.classList.add('light-mode');
  }
  localStorage.setItem('jroc-theme', isDark ? 'dark' : 'light');
  // FIX: Update the icon to reflect current theme
  const themeIcon = document.getElementById('theme-icon');
  if (themeIcon) {
    themeIcon.setAttribute('data-lucide', isDark ? 'moon' : 'sun');
    refreshIcons();
  }
}
applyTheme();
themeBtn.addEventListener('click', () => {
  isDark = !isDark;
  applyTheme();
});

// Copy link - FIX: add feedback toast
document.getElementById('copy-link-btn-l4m8').addEventListener('click', () => {
  navigator.clipboard.writeText(window.location.href).then(() => {
    showToast('Link copied to clipboard!');
  }).catch(() => {
    showToast('Failed to copy link');
  });
});

// Back to top
const backToTop = document.getElementById('back-to-top');
window.addEventListener('scroll', () => {
  backToTop.style.display = window.scrollY > 300 ? 'flex' : 'none';
  // Update TOC scroll spy on scroll
  updateTocActiveState();
});
backToTop.addEventListener('click', () => {
  window.scrollTo({top: 0, behavior: 'smooth'});
});

// Mobile menu
function closeMobileMenu() {
  document.getElementById('sidebar-nav-q9w3').classList.remove('open');
  document.getElementById('sidebar-overlay-v3m1').classList.add('hidden');
}
document.getElementById('mobile-menu-btn-j8k2').addEventListener('click', () => {
  document.getElementById('sidebar-nav-q9w3').classList.add('open');
  document.getElementById('sidebar-overlay-v3m1').classList.remove('hidden');
});
document.getElementById('sidebar-overlay-v3m1').addEventListener('click', closeMobileMenu);
// FIX: Mobile sidebar close button
document.getElementById('sidebar-close-btn').addEventListener('click', closeMobileMenu);

// FIX: Version selector dropdown functionality
const versionBtn = document.getElementById('version-btn-c7j9');
const versionDropdown = document.getElementById('version-dropdown');
const versionLabel = document.getElementById('version-label');

versionBtn.addEventListener('click', () => {
  versionDropdown.classList.toggle('visible');
});

document.querySelectorAll('.version-option').forEach(option => {
  option.addEventListener('click', () => {
    const version = option.dataset.version;
    versionLabel.textContent = version;
    // Update active state
    document.querySelectorAll('.version-option').forEach(o => o.classList.remove('active'));
    option.classList.add('active');
    versionDropdown.classList.remove('visible');
    showToast('Switched to ' + version);
  });
});

// Close version dropdown on outside click
document.addEventListener('click', (e) => {
  if (!document.getElementById('version-sel-container-b6h4').contains(e.target)) {
    versionDropdown.classList.remove('visible');
  }
});

// FIX: Handle browser back/forward navigation (popstate)
window.addEventListener('popstate', (e) => {
  const hash = window.location.hash.replace('#', '');
  if (hash && SECTIONS[hash]) {
    // Don't use navigateTo (it pushes state), set directly
    currentSection = hash;
    const main = document.getElementById('main-content-q6r1');
    main.innerHTML = SECTIONS[hash]();
    refreshIcons();
    document.querySelectorAll('.nav-item').forEach(el => {
      el.classList.toggle('active', el.dataset.section === hash);
    });
    document.querySelectorAll('.nav-group').forEach(group => {
      const activeChild = group.querySelector('.nav-item.active');
      if (activeChild) group.classList.remove('collapsed');
    });
    let groupName = '', itemName = '';
    NAV_STRUCTURE.forEach(g => {
      g.items.forEach(i => {
        if (i.id === hash) { groupName = g.group; itemName = i.label; }
      });
    });
    document.getElementById('breadcrumb-section-i3k7').textContent = (groupName ? groupName + ' / ' : '') + itemName;
    buildTOC();
    bindInteractions();
    window.scrollTo({top: 0, behavior: 'smooth'});
    closeMobileMenu();
  }
});

// Load from hash or default
function loadFromHash() {
  const hash = window.location.hash.replace('#','');
  if (hash && SECTIONS[hash]) {
    // Use replaceState for initial load so we don't double-push
    currentSection = hash;
    const main = document.getElementById('main-content-q6r1');
    main.innerHTML = SECTIONS[hash]();
    refreshIcons();
    document.querySelectorAll('.nav-item').forEach(el => {
      el.classList.toggle('active', el.dataset.section === hash);
    });
    document.querySelectorAll('.nav-group').forEach(group => {
      const activeChild = group.querySelector('.nav-item.active');
      if (activeChild) group.classList.remove('collapsed');
    });
    let groupName = '', itemName = '';
    NAV_STRUCTURE.forEach(g => {
      g.items.forEach(i => {
        if (i.id === hash) { groupName = g.group; itemName = i.label; }
      });
    });
    document.getElementById('breadcrumb-section-i3k7').textContent = (groupName ? groupName + ' / ' : '') + itemName;
    history.replaceState({ section: hash }, '', '#' + hash);
    buildTOC();
    bindInteractions();
  } else {
    // Default to introduction - use replaceState
    currentSection = 'introduction';
    const main = document.getElementById('main-content-q6r1');
    main.innerHTML = SECTIONS['introduction']();
    refreshIcons();
    document.querySelectorAll('.nav-item').forEach(el => {
      el.classList.toggle('active', el.dataset.section === 'introduction');
    });
    document.getElementById('breadcrumb-section-i3k7').textContent = 'Introduction';
    history.replaceState({ section: 'introduction' }, '', '#introduction');
    buildTOC();
    bindInteractions();
  }
}

// Lucide initialization guard
if (typeof lucide !== "undefined" && typeof lucide.createIcons === "function") {
  lucide.createIcons();
}

loadFromHash();
</script>
